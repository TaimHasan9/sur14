services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrtom
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-strong}
      POSTGRES_DB: mrtom_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrtom"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mrtom:${DB_PASSWORD:-change-me-strong}@db:5432/mrtom_db
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
